services:
  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Asia/Seoul
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/policies').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: "postgresql://youth_kkultong:${POSTGRES_PASSWORD:?로컬 .env에 POSTGRES_PASSWORD를 설정하세요}@db:5432/youth_kkultong"
      YOUTH_CENTER_API_KEY: ${YOUTH_CENTER_API_KEY:-}
      YOUTH_CENTER_PAGE_SIZE: ${YOUTH_CENTER_PAGE_SIZE:-50}
      YOUTH_CENTER_REQUEST_DELAY_MS: ${YOUTH_CENTER_REQUEST_DELAY_MS:-3000}
      YOUTH_CENTER_MAX_ATTEMPTS: ${YOUTH_CENTER_MAX_ATTEMPTS:-3}
      POLICY_IMPORT_BATCH_SIZE: ${POLICY_IMPORT_BATCH_SIZE:-200}
    volumes:
      - ingestion_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17.11-bookworm
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: youth_kkultong
      POSTGRES_USER: youth_kkultong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?로컬 .env에 POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  ingestion_logs:

networks:
  app:
  database:
    internal: true
